<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrMicroPickle Discord</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #cccccc;
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .discord-button {
            display: inline-block;
            padding: 16px 32px;
            background: #5865F2;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
        }

        .discord-button:active {
            transform: scale(0.97);
        }

        .fallback {
            margin-top: 30px;
            font-size: 14px;
            color: #888888;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🥒 MrMicroPickle's Discord</h1>

        <p>
            Welcome to the pickle jar.<br>
            Come hang out with the community.
        </p>

        <a
            class="discord-button"
            href="https://discord.gg/tMuNbhf9Fc"
        >
            JOIN THE DISCORD
        </a>

        <div class="fallback">
            If the button doesn't work inside Twitch,
            open this page in your phone's normal browser
            and try again.
        </div>

    </div>

</body>
</html>
